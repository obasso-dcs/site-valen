<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parceiros — State of Valen</title>
  <meta name="description" content="Parceiros do State of Valen no DCS World.">
  <meta name="robots" content="index,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Saira+Stencil+One&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#060d16; --panel:#0e1d31; --line:#25354b; --sand:#f8dbae; --paper:#f0efea; --muted:#a3b3c8; --mono:'IBM Plex Mono',ui-monospace,monospace; --body:'Barlow','Segoe UI',Arial,sans-serif; --display:'Saira Stencil One','Arial Black',Impact,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--paper); font:17px/1.7 var(--body); }
    a { color:var(--sand); }
    header, footer { border-bottom:1px solid var(--line); background:#060d16; }
    header .wrap, footer .wrap { max-width:900px; margin:auto; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; }
    .brand { text-decoration:none; color:var(--paper); font:18px var(--display); letter-spacing:.04em; }
    .back { color:var(--muted); font:12px var(--mono); letter-spacing:.12em; text-transform:uppercase; text-decoration:none; }
    main { max-width:900px; margin:0 auto; padding:64px 24px 88px; }
    .eyebrow { color:var(--sand); font:12px var(--mono); letter-spacing:.16em; text-transform:uppercase; }
    h1,h2 { font-weight:400; }
    h1 { margin:10px 0 12px; font:clamp(32px,6vw,48px)/1.12 var(--display); }
    .lead { color:var(--muted); margin:0 0 40px; max-width:640px; }
    .partners { display:grid; gap:20px; }
    .card { --cut:16px; background:var(--sand); padding:1px; clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut))); }
    .card .in { display:grid; grid-template-columns:minmax(220px,1fr) 1.7fr; height:100%; background:var(--panel); clip-path:inherit; }
    .card .art { display:grid; place-items:center; padding:32px; background:radial-gradient(ellipse 70% 70% at 50% 50%,#12274a 0%,#08111e 80%); border-right:1px solid var(--line); }
    .card .logo { width:min(220px,100%); height:auto; display:block; filter:drop-shadow(0 8px 16px rgba(0,0,0,.5)); }
    .card .txt { display:grid; gap:14px; align-content:center; justify-items:start; padding:32px 36px; }
    .card h2 { color:var(--paper); font-size:clamp(28px,4vw,38px); line-height:1.1; margin:0; }
    .card p { color:var(--muted); margin:0; max-width:560px; }
    .tags { display:flex; flex-wrap:wrap; gap:8px; }
    .tag { font:11px var(--mono); letter-spacing:.14em; text-transform:uppercase; padding:5px 10px; border:1px solid var(--line); color:var(--muted); }
    .btn { margin-top:6px; display:inline-flex; align-items:center; gap:10px; font:500 13px var(--mono); letter-spacing:.12em; text-transform:uppercase; text-decoration:none; padding:14px 22px; background:var(--sand); color:var(--bg); clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%); transition:background .2s; }
    @media(max-width:700px) { .card .in { grid-template-columns:1fr; } .card .art { border-right:0; border-bottom:1px solid var(--line); padding:28px; } .card .txt { padding:26px 22px 30px; } }
    .btn:hover { background:var(--paper); }
    .btn:focus-visible, a:focus-visible { outline:2px solid var(--sand); outline-offset:3px; }
    section { border-top:1px solid var(--line); padding:26px 0; }
    h2 { margin:0 0 10px; font:22px var(--display); color:var(--sand); }
    p { margin:8px 0; }
    ul { padding-left:24px; }
    li { margin:7px 0; }
    .note { padding:16px 18px; background:var(--panel); border-left:2px solid var(--sand); color:var(--muted); }
    footer { border-top:1px solid var(--line); border-bottom:0; color:var(--muted); font:12px var(--mono); letter-spacing:.08em; }
    @media(max-width:600px) { main { padding-top:42px; } header .wrap, footer .wrap { padding-inline:18px; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/">STATE OF VALEN</a>
      <a class="back" href="/">← Voltar ao site</a>
    </div>
  </header>
  <main>
    <p class="eyebrow">State of Valen · DCS World</p>
    <h1>Parceiros</h1>
    <p class="lead">Quem voa com a gente fora do nosso hangar.</p>

    <div class="partners">
      <article class="card"><div class="in">
        <div class="art"><img class="logo" src="/img/logo-chimera-operation.webp" alt="Logo da Chimera Operation: um grifo de asas abertas dentro de um selo circular"></div>
        <div class="txt">
          <span class="eyebrow">Parceiro</span>
          <h2>Chimera Operation</h2>
          <div class="tags"><span class="tag">DCS World</span><span class="tag">Missões</span></div>
          <p>Hospeda missões de parceiros e mantém servidores de DCS no ar 24/7.</p>
          <a class="btn" href="https://chimeradcs.com/" target="_blank" rel="noopener">Visitar o site <span aria-hidden="true">↗</span></a>
        </div>
      </div></article>
    </div>
  </main>
  <footer>
    <div class="wrap"><span>STATE OF VALEN · DCS WORLD · 2026</span><a class="back" href="/">← Voltar ao site</a></div>
  </footer>
</body>
</html>
